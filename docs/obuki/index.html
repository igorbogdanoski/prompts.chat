<!doctype html><html lang="mk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ВИ работилница</title><style>
:root{--paper:#f7f4ec;--ink:#173332;--muted:#50635d;--teal:#066b61;--line:#cdd5ca;--white:#fffef8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:var(--teal)}header{border-bottom:1px solid var(--line);padding:19px max(24px,calc((100vw - 1240px)/2));display:flex;justify-content:space-between;gap:20px;font-size:13px;letter-spacing:.05em}.brand{font-weight:800}main{max-width:1288px;margin:auto;padding:42px 24px}.hero{display:grid;grid-template-columns:1.55fr 1fr;gap:50px;align-items:center;margin-bottom:34px}.eyebrow{color:var(--teal);font-size:13px;font-weight:750;text-transform:uppercase;letter-spacing:.14em}h1{font-size:clamp(36px,5vw,64px);line-height:1.08;letter-spacing:-.045em;margin:15px 0 22px;max-width:740px}h1 span{color:var(--teal)}.intro{max-width:690px;font-size:18px;color:var(--muted)}.path{padding:24px;border-left:3px solid var(--teal);background:#e7ede2}.path strong{font-size:21px}.path ol{padding-left:23px;margin-bottom:0}.path li{padding:4px 0}.path small{color:var(--muted)}.controls{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0;display:grid;gap:15px}.search{width:100%;background:var(--white);border:1px solid #859990;padding:14px 16px;border-radius:4px}.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filter-label{width:74px;font-size:13px;font-weight:750}.chip{border:1px solid var(--line);background:transparent;border-radius:4px;padding:7px 12px;font-size:14px;color:var(--ink)}.chip[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}button:hover{border-color:var(--teal)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e09935;outline-offset:3px}.results-bar{display:flex;justify-content:space-between;align-items:center;margin:24px 0 18px}.quiet{background:none;color:var(--teal);border:0;text-decoration:underline;font-size:14px;padding:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--white);border:1px solid var(--line);padding:23px;min-width:0;display:flex;flex-direction:column}.card-top{display:flex;justify-content:space-between;gap:10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);font-weight:750}.number{color:var(--muted)}h2{font-size:22px;line-height:1.3;margin:15px 0 10px;letter-spacing:-.025em}.outcome{font-size:14px;color:var(--muted);margin:0 0 15px;min-height:44px}.tool{font-size:12px;font-weight:650;margin-bottom:14px;min-height:37px}label.prompt-label{font-size:12px;font-weight:750;display:block;margin-bottom:6px}textarea{width:100%;resize:vertical;min-height:190px;background:#f4f5ef;border:1px solid var(--line);padding:12px;color:#29443d;font-size:13px;line-height:1.55;border-radius:2px}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.copy{background:var(--teal);color:white;border:1px solid var(--teal);padding:9px 16px;border-radius:3px;font-size:14px;font-weight:650}.status{font-size:12px;color:var(--teal);min-height:19px}.detail{border-top:1px solid var(--line);padding-top:12px;margin-top:auto;font-size:13px}.detail strong{font-size:12px}.detail p{margin:5px 0 12px}.detail ul{padding-left:18px;margin:6px 0}.empty{padding:60px 20px;border:1px dashed var(--line);text-align:center}.notes{margin-top:45px;border-top:1px solid var(--line);padding:25px 0;display:grid;grid-template-columns:1fr 1fr;gap:35px}.notes h2{font-size:19px}.notes p{font-size:14px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:20px 24px;text-align:center;font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{gap:28px}}@media(max-width:650px){header{padding:16px 20px;flex-direction:column;gap:3px}main{padding:28px 18px}.hero{grid-template-columns:1fr;gap:15px}.grid,.notes{grid-template-columns:1fr}.path{padding:18px}.filter-label{width:100%}.card{padding:20px}.outcome,.tool{min-height:0}.results-bar{font-size:14px}h1{font-size:42px}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .25s ease}@keyframes appear{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}
